<body>
<header class="desk">
 <h1 id="heading">没有重复 · 10 个方案</h1>
 <div class="tools">
  <div class="seg" aria-label="页面类型"><button data-kind="scan" aria-pressed="false">扫描页 10 案</button><button data-kind="empty" aria-pressed="true">没有重复 10 案</button></div>
  <button class="tool" id="theme" aria-pressed="false">深色</button>
  <select id="focus" aria-label="查看方案"><option value="all">全部方案</option></select>
 </div>
 <div id="scan-controls" class="subtools hidden"><label for="stage">状态</label><select id="stage"><option value="comparing">正在比对</option><option value="preparing">准备中</option><option value="inventory">正在检查</option><option value="sampling">正在比对候选文件</option></select><label for="progress">进度</label><input id="progress" type="range" min="0" max="100" value="66"><button id="play">演示进度</button></div>
 <div id="empty-controls" class="subtools"><label>进入方式</label><button data-entry="scan" aria-pressed="true">扫描后没有重复</button><button data-entry="cleanup" aria-pressed="false">清理后没有重复</button></div>
 <p class="hint" id="hint">两种入口使用完全相同的页面。选编号可单独放大。</p>
</header>
<main class="board" id="board"></main>
<script>
const scanNames=['居中横条','左对齐计数','圆形进度','悬浮进度舱','横向进度胶囊','大字百分比','竖向进度','相片扫描','底部平铺','分段进度'];
const emptyNames=['单张相片','相片收拢','叠片合一','横排图文','圆形底片','圆角相框','折角相片','抽象山景','相片印章','紧凑胶囊'];
const params=new URLSearchParams(location.search);
const finalChoice=params.get('final')==='1';
let kind=params.get('view')==='scan'?'scan':'empty';
let focus=params.get('option')||'all';
let stage='comparing',percent=66,timer=null;
const labels={comparing:'正在比对',preparing:'准备中',inventory:'正在检查',sampling:'正在比对候选文件'};
const icons={back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m7-7-7 7 7 7"/></svg>',status:'<svg viewBox="0 0 44 13" aria-hidden="true" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="1" width="3" height="11" rx="1"/><path d="M19 5q5-5 10 0l-2 2q-3-3-6 0zM22 9q2-2 4 0l-2 3z"/><rect x="33" y="2" width="9" height="10" rx="2"/><path d="M43 5h1v4h-1z"/></svg>'};
function svg(body){return '<svg class="pic" viewBox="0 0 220 200" preserveAspectRatio="xMidYMid meet" fill="none" aria-hidden="true">'+body+'</svg>'}
function check(x,y,r=25){return `<circle class="strong" cx="${x}" cy="${y}" r="${r}"/><path class="check" d="M${x-r*.43} ${y}l${r*.29} ${r*.30} ${r*.60}-${r*.62}"/>`}
function mountain(x=54,y=90,s=1,cls='strong'){return `<path class="${cls}" d="M${x} ${y+57*s}l${34*s}-${48*s} ${27*s} ${34*s} ${19*s}-${23*s} ${29*s} ${37*s}z"/>`}
function pairedPhotos(scanning=false){
 const landscape='M18 108L43 77Q50 67 57 77L69 92Q74 98 79 92L84 86Q91 77 98 86L119 109Q124 116 115 116H23Q13 116 18 108Z';
 return svg(`<g transform="translate(22 27) rotate(-11 68 68)"><rect class="back-photo" width="136" height="136" rx="28"/><circle class="back-land" cx="39" cy="40" r="11"/><path class="back-land" d="${landscape}"/></g><g transform="translate(60 38)"><rect class="tonal" width="136" height="136" rx="28"/><circle class="strong" cx="103" cy="38" r="11"/><path class="strong" d="${landscape}"/></g>${scanning?'':check(178,157,27)}`);
}
function graphic(id,scanning=false){
 const badge=scanning?'':check(167,148,27);
 switch(id){
  case 1:return svg(`<rect class="tonal" x="37" y="24" width="142" height="139" rx="29"/><circle class="strong" cx="140" cy="62" r="12"/>${mountain(53,82,.88)}${badge}`);
  case 2:return pairedPhotos(scanning);
  case 3:return pairedPhotos(scanning);
  case 4:return svg(`<rect class="tonal" x="29" y="29" width="153" height="143" rx="38"/>${mountain(47,92,.94)}<circle class="strong" cx="145" cy="67" r="13"/>${scanning?'':check(175,150,29)}`);
  case 5:return svg(`<circle class="low" cx="110" cy="100" r="88"/><rect class="tonal" x="48" y="39" width="126" height="121" rx="27"/><circle class="strong" cx="139" cy="69" r="11"/>${mountain(62,91,.80)}${scanning?'':check(166,150,27)}`);
  case 6:return svg(`<rect class="tonal" x="29" y="23" width="162" height="155" rx="37"/><rect class="paper" x="44" y="38" width="132" height="106" rx="24"/>${mountain(49,85,.99)}<circle class="mid" cx="145" cy="65" r="12"/>${scanning?'':check(171,154,27)}`);
  case 7:return svg(`<path class="tonal" d="M57 24h83l47 45v81q0 26-26 26H57q-26 0-26-26V50q0-26 26-26z"/><path class="mid" d="M140 24v22q0 23 23 23h24z"/>${mountain(47,91,.95)}<circle class="strong" cx="104" cy="65" r="11"/>${scanning?'':check(173,151,26)}`);
  case 8:return svg(`<path class="tonal" d="M25 103q0-63 61-72h48q61 9 61 72v19q0 49-49 49H74q-49 0-49-49z"/><path class="mid" d="M25 124l54-66 58 75 31-37 27 29v8q0 38-49 38H74q-49 0-49-38z"/><path class="strong" d="M40 153l53-65 58 83H74q-23 0-34-18z"/><circle class="strong" cx="151" cy="67" r="13"/>${scanning?'':check(179,153,26)}`);
  case 9:return svg(`<rect class="mid" x="24" y="28" width="138" height="138" rx="30" transform="rotate(-8 93 97)"/><rect class="tonal" x="36" y="33" width="138" height="138" rx="30"/>${mountain(51,93,.89)}<circle class="strong" cx="139" cy="68" r="12"/>${scanning?'':check(177,129,33)}`);
  default:return svg(scanning?'<rect class="strong" x="67" y="55" width="86" height="86" rx="24"/>':check(110,100,64));
 }
}
function illustration(id,scan=false){return `<div class="illustration">${graphic(id,scan)}</div>`}
function progress(){return `<div class="progress ${stage==='preparing'?'indeterminate':''}" role="progressbar" aria-label="扫描进度" ${stage==='preparing'?'':`aria-valuenow="${percent}" aria-valuemin="0" aria-valuemax="100"`}><div class="remaining"></div><div class="fill"></div></div>`}
function count(style='normal'){
 if(stage==='preparing')return '';
 const current=Math.round(percent/100*1280).toLocaleString('en-US');
 if(style==='split')return `<div class="count">${current}<span> / 1,280</span></div>`;
 return `<div class="count">${current} / 1,280</div>`;
}
function scanContent(id){
 const s=`<h3 class="stage">${labels[stage]}</h3>`,p=progress(),c=count();
 switch(id){
  case 1:return illustration(1,true)+s+p+c;
  case 2:return illustration(2,true)+s+count('split')+p;
  case 3:return `<div class="ring"><svg viewBox="0 0 216 216" aria-hidden="true"><circle class="track" cx="108" cy="108" r="96"/><circle class="arc" cx="108" cy="108" r="96"/></svg>${stage==='preparing'?illustration(10,true):`<div class="ring-count">${Math.round(percent/100*1280).toLocaleString('en-US')}<span>/ 1,280</span></div>`}</div>`+s;
  case 4:return illustration(3,true)+`<div class="scan-capsule"><div class="row">${s}${c}</div>${p}</div>`;
  case 5:return `<div class="compact"><div class="compact-head">${illustration(1,true)}<div class="compact-type">${s}${c}</div></div>${p}</div>`;
  case 6:return s+(stage==='preparing'?illustration(1,true):`<div class="percent">${percent}<span>%</span></div>`)+p;
  case 7:return `<div class="vertical-layout"><div class="vertical-track"></div><div class="vertical-type">${s}${count('split')}</div></div>`;
  case 8:return `<div class="picture-scan">${illustration(6,true)}<div class="scan-beam"></div></div>`+s+c;
  case 9:return illustration(2,true)+`<div class="flat-progress"><div class="row">${s}${c}</div>${p}</div>`;
  default:return illustration(7,true)+s+`<div class="segmented" role="progressbar" aria-label="扫描进度" ${stage==='preparing'?'':`aria-valuenow="${percent}" aria-valuemin="0" aria-valuemax="100"`}>${Array.from({length:12},(_,i)=>`<div class="segment ${i<(stage==='preparing'?4:Math.ceil(percent*.12))?'on':''}"></div>`).join('')}</div>`+c;
 }
}
function resultContent(id){
 const image=illustration(id),text='<h3 class="result-title">没有重复</h3>';
 if(id===4)return `<div class="result-row">${image}${text}</div>`;
 if(id===6)return `<div class="result-panel">${image}${text}</div>`;
 if(id===10)return `<div class="result-pill">${image}${text}</div>`;
 return image+text;
}
function phoneMarkup(pageKind,n,name,selected=false){
 const id=String(n).padStart(2,'0');
 return `<figure class="proposal ${selected?'selected':''}" id="${pageKind}-${id}"><figcaption class="caption"><b>${id}</b><span>${name}</span></figcaption><div class="phone ${pageKind==='scan'?'scan scan':'result empty'}${id}" style="--p:${stage==='preparing'?35:percent}%;--dash:${stage==='preparing'?160:percent*6.032};--scan-y:${stage==='preparing'?50:25+percent*.5}%"><div class="status"><span>9:41</span>${icons.status}</div><div class="toolbar"><button class="back" aria-label="返回">${icons.back}</button><h2>重复文件</h2></div><div class="screen"><div class="content">${pageKind==='scan'?scanContent(n):resultContent(n)}</div><div class="nav"></div></div></div></figure>`;
}
function render(){
 document.querySelectorAll('[data-kind]').forEach(el=>el.setAttribute('aria-pressed',el.dataset.kind===kind));
 document.getElementById('heading').textContent=finalChoice?'去重 · 最终方案':kind==='scan'?'扫描页 · 10 个方案':'没有重复 · 10 个方案';
 document.getElementById('scan-controls').classList.toggle('hidden',kind!=='scan');
 document.getElementById('empty-controls').classList.toggle('hidden',kind!=='empty');
 document.getElementById('hint').textContent=kind==='scan'?'每案只保留一个状态和一种进度表达。选编号可单独放大。':'两种入口使用完全相同的页面。选编号可单独放大。';
 const names=kind==='scan'?scanNames:emptyNames;
 document.getElementById('focus').innerHTML='<option value="all">全部方案</option>'+names.map((n,i)=>`<option value="${i+1}">${String(i+1).padStart(2,'0')} ${n}</option>`).join('');
 document.getElementById('focus').value=focus;
 document.body.classList.toggle('single',!finalChoice&&focus!=='all');
 document.getElementById('board').innerHTML=finalChoice?phoneMarkup('scan',2,'扫描页 · 02',true)+phoneMarkup('empty',3,'结果页 · 03',true):names.map((name,i)=>phoneMarkup(kind,i+1,name,String(i+1)===focus)).join('');
 document.querySelectorAll('.back').forEach(button=>button.addEventListener('click',()=>{
  const screen=button.closest('.phone').querySelector('.screen');
  const layer=document.createElement('div');layer.className='cancel-layer';layer.innerHTML=`<p>${button.closest('.phone').classList.contains('scan')?'扫描已停止':'已返回相册'}</p><button>返回方案</button>`;
  layer.querySelector('button').onclick=()=>layer.remove();screen.append(layer);
 }));
}
function setKind(value){kind=value;focus='all';stopPlayback();render();setUrl()}
function setUrl(){const q=new URLSearchParams(location.search);q.set('view',kind);if(focus==='all')q.delete('option');else q.set('option',focus);history.replaceState(null,'','?'+q.toString())}
function stopPlayback(){if(timer){clearInterval(timer);timer=null}document.getElementById('play').textContent='演示进度'}
document.querySelectorAll('[data-kind]').forEach(el=>el.onclick=()=>setKind(el.dataset.kind));
document.getElementById('theme').onclick=()=>{const dark=document.body.classList.toggle('dark');document.getElementById('theme').textContent=dark?'浅色':'深色';document.getElementById('theme').setAttribute('aria-pressed',dark)};
document.getElementById('focus').onchange=e=>{focus=e.target.value;render();setUrl()};
document.getElementById('stage').onchange=e=>{stage=e.target.value;stopPlayback();render()};
document.getElementById('progress').oninput=e=>{percent=Number(e.target.value);render()};
document.getElementById('play').onclick=()=>{if(timer){stopPlayback();return}stage='comparing';document.getElementById('stage').value=stage;percent=0;document.getElementById('progress').value=percent;render();document.getElementById('play').textContent='停止演示';timer=setInterval(()=>{percent=Math.min(100,percent+2);document.getElementById('progress').value=percent;render();if(percent===100)stopPlayback()},180)};
document.querySelectorAll('[data-entry]').forEach(el=>el.onclick=()=>{document.querySelectorAll('[data-entry]').forEach(b=>b.setAttribute('aria-pressed',b===el)); /* Both origins intentionally render the same resultContent. */});
if(params.get('theme')==='dark'){document.body.classList.add('dark');document.getElementById('theme').textContent='浅色';document.getElementById('theme').setAttribute('aria-pressed','true')}
if(params.get('sheet')==='1')document.body.classList.add('sheet');
if(finalChoice)document.body.classList.add('final');
render();
</script>
</body>
</html>

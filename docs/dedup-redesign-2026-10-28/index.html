.pairgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tile{background:var(--low);padding:8px;border:1px solid transparent;border-radius:14px;color:var(--ink);text-align:left;position:relative;min-width:0}.tile.selected{border-color:var(--accent);background:var(--card)}.tile .thumb{height:108px;width:100%;margin-bottom:7px;border-radius:9px}.tile .check{position:absolute;top:15px;right:15px}.tile .filename{font-size:11px}.v2 .footer{background:var(--card);border-radius:24px 24px 0 0;padding-top:15px}.v2 .group{margin-bottom:16px}.v3 .summary{padding-bottom:13px;border-bottom:1px solid var(--line)}.v3 .row{min-height:61px;padding:5px 0}.v3 .thumb{width:43px;height:43px;border-radius:8px}.v3 .footer{border-top:1px solid var(--line)}.v3 .count{display:flex;align-items:center;gap:8px}.v3 .count small{margin:0}.v3 .grouphead{background:var(--low);margin:0 -6px;padding:0 8px;border-radius:8px}.hero{display:flex;align-items:center;gap:12px;background:var(--low);border-radius:16px;padding:10px;margin:5px 0}.hero .thumb{width:90px;height:90px;border-radius:10px}.copies{padding-left:12px;border-left:2px solid var(--line);margin:10px 0 0 15px}.v4 .footer{background:var(--low)}.v4 .full{border-radius:16px}.matrix{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:14px;overflow:hidden}.matrixcol{min-width:0;padding:10px}.matrixcol+ .matrixcol{border-left:1px solid var(--line);background:var(--low)}.matrix .thumb{width:100%;height:100px;margin:8px 0}.matrix button{border:0;background:none;color:var(--ink);text-align:left;padding:0;width:100%;position:relative}.matrix .check{position:absolute;top:15px;right:7px}.matrix .filename{font-size:10px}.v5 .footer{border-top:1px solid var(--line)}.v6 .scroll{padding-left:22px;padding-right:22px}.v6 .group{border-left:2px solid var(--line);padding-left:14px;margin-left:4px;position:relative}.v6 .group:before{content:"";position:absolute;width:8px;height:8px;background:var(--accent);border-radius:50%;left:-5px;top:15px}.v6 .row{padding:6px 0;min-height:70px}.v6 .footer{margin:0 12px 8px;padding:12px;background:var(--card);border-radius:22px}.v6 .primary{border-radius:14px}.strip{display:flex;gap:9px;overflow:auto;scrollbar-width:none;padding:5px 0 10px}.strip .tile{flex:0 0 135px}.strip .thumb{height:104px}.v7 .group{padding-bottom:8px;border-bottom:1px solid var(--line)}.v7 .footer{background:var(--low)}.v7 .count small{display:inline;margin-left:8px}.accordion{background:var(--low);border-radius:18px;padding:0 12px;margin-bottom:12px}.accordion summary{list-style:none;cursor:pointer;min-height:76px;display:flex;align-items:center;gap:10px;font-size:13px}.accordion summary::-webkit-details-marker{display:none}.accordion summary .thumb{width:48px;height:48px}.accordion summary strong{flex:1}.accordion summary small{font-size:11px;color:var(--muted);font-weight:400;display:block;margin-top:5px}.accordion summary .arrow{transform:rotate(0deg);color:var(--accent)}.accordion[open] summary .arrow{transform:rotate(180deg)}.accordion .row{border-top:1px solid var(--line)}.v8 .footer{padding-top:8px}.v8 .dock{background:var(--card);padding:12px;border-radius:18px}.v9 .group{border:1px solid var(--line);border-radius:18px;overflow:hidden}.v9 .grouphead{padding:6px 12px;background:var(--low)}.v9 .row{padding:8px 12px}.v9 .keeper{background:var(--low)}.v9 .footer{border-top:1px solid var(--line)}.v9 .count small{display:inline;margin-left:10px}.v10 .summary{display:flex;align-items:center;justify-content:space-between;gap:12px}.v10 .summary h4{font-size:20px}.v10 .group{margin-bottom:14px}.v10 .row{min-height:62px;padding:5px 0}.v10 .thumb{width:44px;height:44px}.v10 .keeper .thumb{width:34px;height:34px}.v10 .keeper{min-height:51px}.v10 .footer{margin:0 16px 9px;padding:0;background:none}.v10 .primary{width:100%;min-height:55px;justify-content:space-between;padding:12px 19px}.v10 .primary small{font-weight:400;opacity:.85}.toast{position:absolute;bottom:54px;left:16px;ri <header class="intro"><h1>去重页面，10 个完整方向</h1><p>全部沿用统一的 64dp 顶栏、20dp 主体圆角与主题色。比较内容布局与底部操作，保留逐项选择、按组选择、全选副本和移入回收站。</p><p>可点选副本、切换明暗、展开分组，并体验左右滑动关闭提示。示例素材与数量仅用于设计演示；不会读取或移动文件。</p><div class="controls"><button id="theme">切换深色</button><button id="toast-demo">显示 toast（可左右滑动）</button><button id="all">查看全部</button><select id="picker" aria-label="单独查看方案" style="font:inherit;border-radius:20px;padding:8px 14px;border:1px solid #d4d3dd"><option value="">单独放大方案…</option></select></div></header>
<main class="board"></main>
<script>
const finalMode=new URLSearchParams(location.search).has("final");
const defs=[
['01','分组清单','细分隔线整理文件，底部用单行“数量＋操作”。','信息完整，最接近现有使用习惯。'],
['02','双列照片','保留与副本并排看，柔和底托集中数量和操作。','图片辨认更直观，纵向容纳较少。'],
['03','紧凑文件表','缩小缩略图与行距，底栏收成一行。','适合一次处理大量重复文件。'],
['04','保留照片领衔','每组先呈现保留照片，副本缩进排列。','保留关系最清楚，底部按钮完整显示。'],
['05','左右核对','固定保留／副本两列，照片与文件信息对应。','适合逐组仔细核对，长文件名空间较少。'],
['06','分组导线','导线串起组内文件，底部放独立操作浮岛。','分组边界清楚，底栏与内容分离。'],
['07','横向底片','每组一排照片底片，副本逐张点选。','适合一张照片有多份副本，需横向查看。'],
['08','可展开分组','折叠时显示照片和份数，展开后逐项核对。','总览最简洁；需增加组展开交互。'],
['09','保留区与副本区','浅色保留行与白色副本行分区，底栏上下分工。','状态辨认明确，操作区略高。'],
['10','轻量清理条','精简文件行，底部一个按钮同时显示数量与容量。','底部最轻，空间留给文件。']];
const svg=(type)=>{const scenes=[`<rect width="300" height="200" fill="#c9d8df"/><path d="M0 145L85 45l90 110 60-82 65 85v42H0Z" fill="#7b9498"/><path d="M45 95l40-50 39 48-37-15Z" fill="#f4f5ee"/><path d="M0 167l95-41 89 36 116-22v60H0Z" fill="#526f70"/><path d="M0 184q90-35 180 5l120-15v26H0Z" fill="#a8b9a5"/>`,`<rect width="300" height="200" fill="#bfd7df"/><rect y="85" width="300" height="115" fill="#668e9d"/><path d="M0 105q75 47 120 23t180 10v62H0Z" fill="#94b4b9"/><path d="M0 145q75-20 140 24t160-3v34H0Z" fill="#d8cfb6"/><path d="M195 90l25-30 12 32Z" fill="#faf5e9"/>`,`<rect width="300" height="200" fill="#d7d0c7"/><rect x="8" y="40" width="85" height="160" fill="#888888"/><rect x="109" y="15" width="76" height="185" fill="#bda993"/><rect x="202" y="63" width="90" height="137" fill="#7e8f91"/><path d="M20 60h55m-55 22h55m-55 22h55m-55 22h55m-55 22h55M120 38h50m-50 24h50m-50 24h50m-50 24h50m-50 24h50M215 85h60m-60 24h60m-60 24h60" stroke="#ede7d8" stroke-width="8"/><path d="M0 181h300v19H0Z" fill="#676c72"/>`];return 'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">${scenes[type]}</svg>`)};
const groups=[{name:'Mountain',size:'5.2 MB',folder:'Camera',copies:['Downloads','Pictures']},{name:'Coast',size:'4.1 MB',folder:'Camera',copies:['Downloads']},{name:'City',size:'3.9 MB',folder:'Camera',copies:['Pictures']}];
const bin='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7"/></svg>';
const back='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12H4m7-7-7 7 7 7"/></svg>';
const states=defs.map(()=>new Set(['0-1','0-2','1-1','2-1']));
function image(g){return `<img class="thumb" src="${svg(g)}" alt="${groups[g].name} 示例缩略图">`}
function check(keeper,selected){return `<span class="check">${selected?'✓':''}</span>`}
function metadata(g,j){const x=groups[g];return `<div class="meta"><div class="tag">${j===0?'Keep · Recommended':'Copy'}</div><div class="filename">${x.name}${j?'_copy'+j:''}.jpg</div><div class="details">${j?x.copies[j-1]:x.folder} · ${x.size}</div></div>`}
function row(g,j,v,tile=false){let keeper=j===0,sel=states[v].has(`${g}-${j}`);return `<button class="${tile?'tile':'row'} ${sel?'selected':''} ${keeper?'keeper':''}" data-entry="${g}-${j}" aria-pressed="${sel}" aria-label="${keeper?'推荐保留':'选择副本'} ${groups[g].name} ${j}">${image(g)}${metadata(g,j)}${check(keeper,sel)}</button>`}
function head(g,v){let count=groups[g].copies.length+1;return `<div class="grouphead"><strong>Group ${g+1} · ${count} files</strong><button class="textbutton" data-group="${g}">Select copies</button></div>`}
function summary(v){return `<div class="summary"><div class="inline"><h4>3 duplicate groups</h4>${finalMode?'':'<button class="textbutton" data-selectall>Select copies</button>'}</div></div>`}
function group(g,v){let n=groups[g].copies.length+1;let rows=Array.from({length:n},(_,j)=>row(g,j,v)).join('');if(v===1)return `<section class="group">${head(g,v)}<div class="pairgrid">${Array.from({length:n},(_,j)=>row(g,j,v,true)).join('')}</div></section>`;if(v===3)return `<section class="group">${head(g,v)}<button class="hero ${states[v].has(`${g}-0`)?'selected':''}" data-entry="${g}-0" style="width:100%;border:0;text-align:left;color:var(--ink)">${image(g)}${metadata(g,0)}${check(true,states[v].has(`${g}-0`))}</button><div class="copies">${Array.from({length:n-1},(_,j)=>row(g,j+1,v)).join('')}</div></section>`;if(v===4)return `<section class="group">${head(g,v)}<div class="matrix"><div class="matrixcol"><button data-entry="${g}-0" class="${states[v].has(`${g}-0`)?'selected':''}"><div class="tag">Keep · Recommended</div>${image(g)}${check(true,states[v].has(`${g}-0`))}<div class="filename">${groups[g].name}.jpg</div><div class="details">Camera · ${groups[g].size}</div></button></div><div class="matrixcol"><div class="tag">Copies (${n-1})</div>${Array.from({length:n-1},(_,j)=>`<button data-entry="${g}-${j+1}" class="${states[v].has(`${g}-${j+1}`)?'selected':''}" aria-pressed="${states[v].has(`${g}-${j+1}`)}">${image(g)}${check(false,states[v].has(`${g}-${j+1}`))}<div class="filename">${groups[g].name}_copy${j+1}.jpg</div><div class="details">${groups[g].copies[j]}</div></button>`).join('')}</div></div></section>`;if(v===6)return `<section class="group">${head(g,v)}<div class="strip">${Array.from({length:n},(_,j)=>row(g,j,v,true)).join('')}</div></section>`;if(v===7)return `<details class="accordion" ${g===0?'open':''}><summary>${image(g)}<strong>${groups[g].name}<small>${n} identical files · ${groups[g].size} each</small></strong><span class="arrow">⌄</span></summary>${head(g,v)}${rows}</details>`;return `<section class="group">${head(g,v)}${rows}</section>`}
function count(v){let mb=0;for(const id of states[v])mb+=parseFloat(groups[+id[0]].size);return `<div class="count"><span class="num">${states[v].size} selected</span><small><span class="mb">${mb.toFixed(1)} MB</span>${finalMode?'':' to reclaim'}</small></div>`}
function action(v){return `<button class="primary move" ${states[v].size?'':'disabled'}>${bin} Move to bin</button>`}
function footer(v){if(finalMode&&v===6)return `<footer class="footer"><div class="dock">${count(v)}<button class="textbutton footer-select" data-selectall>Select copies</button>${action(v)}</div></footer>`;if(v===2)return `<footer class="footer"><div class="dock">${count(v)}${action(v)}</div></footer>`;if(v===3||v===6||v===8)return `<footer class="footer"><div class="dock">${count(v)}<button class="textbutton" data-selectall>Select copies</button></div><button class="primary full move" ${states[v].size?'':'disabled'}>${bin} Move to bin</button>${v===3?'<div class="safety">✓ You can restore files from the bin.</div>':''}</footer>`;if(v===9){let mb=0;for(const id of states[v])mb+=parseFloat(groups[+id[0]].size);return `<footer class="footer"><button class="primary move" ${states[v].size?'':'disabled'}><span>${states[v].size} copies · ${mb.toFixed(1)} MB</span><span style="display:flex;align-items:center;gap:6px">${bin} Move to bin</span></button></footer>`}return `<footer class="footer"><div class="dock">${count(v)}${action(v)}</div></footer>`}
function renderPhone(v){return `<div class="status"><span>9:41</span><span>▴ ▰ ▮</span></div><div class="toolbar"><span class="back">${back}</span><h3>Duplicate review</h3></div><div class="body"><div class="scroll">${summary(v)}${groups.map((_,g)=>group(g,v)).join('')}</div>${footer(v)}<div class="nav"></div></div><div class="toast hidden" role="status">Selection updated</div>`}
document.querySelector('.board').innerHTML=defs.map((d,v)=>`<article class="proposal" id="option-${d[0]}"><div class="caption"><h2>${d[0]}　${d[1]}</h2><p>${d[2]}</p></div><div class="phone v${v+1}" data-v="${v}">${renderPhone(v)}</div><p class="print-note">${d[3]}</p></article>`).join('');
defs.forEach(d=>document.querySelector('#picker').add(new Option(`${d[0]} ${d[1]}`,d[0])));
document.querySelector('#picker').onchange=e=>{document.body.classList.toggle('focus',!!e.target.value);document.querySelectorAll('.proposal').forEach(p=>p.classList.toggle('active',p.id===`option-${e.target.value}`))};document.querySelector('#all').onclick=()=>{document.body.classList.remove('focus');document.querySelector('#picker').value=''};
document.querySelector('#theme').onclick=()=>{document.body.classList.toggle('dark');document.querySelector('#theme').textContent=document.body.classList.contains('dark')?'切换浅色':'切换深色'};
let toastTimers=new WeakMap();function showToast(phone,msg){let toast=phone.querySelector('.toast');clearTimeout(toastTimers.get(toast));toast.textContent=msg;toast.classList.remove('hidden');toast.style.transform='';toastTimers.set(toast,setTimeout(()=>toast.classList.add('hidden'),5000));}
function syncSelectionLabels(){document.querySelectorAll('.phone').forEach(p=>{let v=+p.dataset.v;p.querySelectorAll('[data-selectall],[data-group]').forEach(b=>{let ids=groups.flatMap((g,i)=>b.hasAttribute('data-group')&&+b.dataset.group!==i?[]:g.copies.map((_,j)=>`${i}-${j+1}`));b.textContent=ids.every(id=>states[v].has(id))?'Deselect all':'Select copies'});p.querySelectorAll('[data-entry]').forEach(b=>{let id=b.dataset.entry;if(id.endsWith('-0')){let label=b.querySelector('.tag');if(label)label.textContent=states[v].has(id)?'Selected for bin':'Keep · Recommended'}})})}syncSelectionLabels();
document.querySelector('#toast-demo').onclick=()=>document.querySelectorAll('.phone').forEach(p=>showToast(p,'Selection updated'));
document.addEventListener('click',e=>{const p=e.target.closest('.phone');if(!p)return;let v=+p.dataset.v,entry=e.target.closest('[data-entry]'),all=e.target.closest('[data-selectall]'),grp=e.target.closest('[data-group]');if(entry||all||grp){let ids=entry?[entry.dataset.entry]:groups.flatMap((g,i)=>grp&&+grp.dataset.group!==i?[]:g.copies.map((_,j)=>`${i}-${j+1}`));let remove=ids.every(id=>states[v].has(id));ids.forEach(id=>{if(remove){states[v].delete(id);return}let g=+id[0];let chosen=[...states[v]].filter(x=>+x[0]===g).length;if(chosen<groups[g].copies.length)states[v].add(id)});let scroll=p.querySelector('.scroll').scrollTop;let opened=[...p.querySelectorAll('details')].map(d=>d.open);p.innerHTML=renderPhone(v);p.querySelector('.scroll').scrollTop=scroll;p.querySelectorAll('details').forEach((d,i)=>d.open=opened[i]);syncSelectionLabels()}if(e.target.closest('.move')){let overlay=document.createElement('div');overlay.className='overlay';overlay.innerHTML=`<div class="dialog"><h4>Move selected copies?</h4><p>${states[v].size} copies selected. Keep at least one file per group.</p><p>设计演示：实际应用仍会复核文件并请求系统权限。本页面不会移动文件。</p><button class="textbutton" data-close>Back to review</button></div>`;p.append(overlay)}if(e.target.closest('[data-close]'))e.target.closest('.overlay').remove()});
let start=null;document.addEventListener('pointerdown',e=>{let t=e.target.closest('.toast');if(!t)return;start={t,x:e.clientX,y:e.clientY};t.setPointerCapture(e.pointerId)});document.addEventListener('pointermove',e=>{if(start)start.t.style.transform=`translateX(${e.clientX-start.x}px)`});document.addEventListener('pointerup',e=>{if(!start)return;let {t,x,y}=start;if(Math.abs(e.clientX-x)>70&&Math.abs(e.clientX-x)>Math.abs(e.clientY-y)){t.classList.add('hidden');clearTimeout(toastTimers.get(t))}t.style.transform='';start=null});document.addEventListener('pointercancel',()=>{if(start)start.t.style.transform='';start=null});

if(finalMode){document.body.classList.add('final-view');const card=document.querySelector('#option-07');card.classList.add('chosen');card.querySelector('.phone').classList.add('final-choice');card.querySelector('.caption').innerHTML='<h2>横向照片分组 + 悬浮操作栏</h2><p>组间留白，无分隔横线；底栏四周透出列表。</p>';card.querySelector('.print-note').textContent='逐张左右查看，点选副本。';document.querySelector('h1').textContent='去重页面 · 最终方案';document.querySelector('.intro p').textContent='统一新顶栏与圆角主体。横向照片条按组排列，用留白和轻底色建立层次，底部仅保留悬浮操作栏本身。';document.querySelector('#picker').hidden=true;document.querySelector('#all').textContent='查看原十案';document.querySelector('#all').onclick=()=>location.href='index.html';}
</script>
</html>
